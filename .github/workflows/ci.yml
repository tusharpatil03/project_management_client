name: Continuous Integration

# 1. Define when the workflow will run (Triggers)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 2. Define the execution environment and sequential tasks
jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest # Uses a GitHub-hosted virtual machine

    steps:
      # Step 1: Download a copy of your repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Provision the required runtime environment (e.g., Node.js)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm' # Speeds up subsequent runs by caching dependencies

      # Step 3: Install application dependencies cleanly
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run your compiler/build tool (optional)
      - name: Build Application
        run: npm run build --if-present
